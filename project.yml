name: Gauss
options:
  bundleIdPrefix: com.gauss
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultLocalizations: [en, zh-Hans]

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.0.0"
  GaussEngine:
    path: GaussEngine

targets:
  Gauss:
    type: application
    platform: macOS
    sources:
      - path: Gauss
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - package: GaussEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gauss.app
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: 4
        INFOPLIST_FILE: Gauss/Info.plist
        CODE_SIGN_ENTITLEMENTS: Gauss/Gauss.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: T247WTJV77
        CODE_SIGN_STYLE: Manual
        PRODUCT_NAME: Gauss
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"

  GaussTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GaussTests
    dependencies:
      - target: Gauss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gauss.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Gauss:
    build:
      targets:
        Gauss: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GaussTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
